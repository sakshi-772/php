<!DOCTYPE html>
<html>
<body>
<h3>arithmetic alert operations</h3>
<button onclick="add(4,6)">add</button>
<button onclick="sub(8,5)">sub</button>
<button onclick="mult(3,8)">mult</button>
<button onclick="div(7,4)">div</button>
<button onclick="mod(4,7)">mod</button>
<script>
function add(a,b)
{

sum=a+b;
alert(sum);
}
function sub(a,b)
{
s=a-b;
alert(s);
}
function mult(a,b)
{
m=a*b;
alert(m);

}
function div(a,b)
{
d=a/b;
alert(d);
}
function mod(a,b)
{

m=a%b;
alert(m);
}

</script>
</body>
</html>
