<!DOCTYPE html>
<html>
<body>
<h3>arithmetic operations</h3>
<script>
function add()
{
let a=5;
let b=9;
sum=a+b;
document.write("addition is: ",sum,"<br>");
}
function sub()
{
let a=5;
let b=9;
s=a-b;
document.write("subtraction is: ",s,"<br>");
}
function mult()
{
let a=5;
let b=9;
m=a*b;
document.write("multiplication is: ",m,"<br>");

}
function div()
{
let a=5;
let b=9;
d=a/b;
document.write("division is:\n ",d,"<br>");
}
function mod()
{
let a=5;
let b=9;
m=a%b;
document.write("mod is: \n",m,"<br>");
}
function operations()
{
add();
sub();
mult();
div();
mod();
}
operations()
</script>
</body>
</html>
