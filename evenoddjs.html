<!DOCTYPE html>
<html>
<body>
<h4>check the no is odd or even</h4>
enter the number:
<input type="number" name="a" id="a">
<button onclick="getInput()">submit</button>
<script>
function getInput()
{
let a=document.getElementById("a").value;
if(a%2==0)
{
document.write("no is even");
}
else
{
document.write("no is odd");
}
}
</script>
</body>
</html>
